kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  kubeadmConfigPatches:
  - |
    kind: InitConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        - "--node-ip=10.0.0.2"
        - "--node-ip=10.0.0.2"
  extraPortMappings:
  - containerPort: 30080
    hostPort: 80
    protocol: TCP
  - containerPort: 30081
    hostPort: 8080
    protocol: TCP
  - containerPort: 30082
    hostPort: 8081
    protocol: TCP
- role: worker
  extraPortMappings:
  - containerPort: 30083
    hostPort: 5001
    protocol: TCP
  - containerPort: 30084
    hostPort: 5002
    protocol: TCP
