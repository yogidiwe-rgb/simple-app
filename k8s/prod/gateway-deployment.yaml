apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: prod
  labels:
    app: gateway
    environment: production
    project: simple-fullstack-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
        environment: production
    spec:
      containers:
      - name: gateway
        image: docker.io/yogisre12345/simple-fullstack-app:prod-latest
        ports:
        - containerPort: 3000
        env:
        - name: BACKEND_URL
          value: "http://backend-service:5001"
        - name: NODE_ENV
          value: "production"
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "400m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 60
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: prod
  labels:
    app: gateway
    environment: production
spec:
  selector:
    app: gateway
  ports:
  - name: http
    port: 3000
    targetPort: 3000
  type: ClusterIP
